name: Contexts demo
on: [push]                            # Triggers the workflow on every push to the repository

env:
  project: "roboshop"
  component: "catalogue"
  environment: "dev"

jobs:
  # Job name
  github-context:
    runs-on: ubuntu-latest            # Github hosted runners
    steps:
      - name: Print info
        run: |
          echo "${{ toJson(github) }}"
          echo "Branch name: ${{ github.ref_name }}"
      
      - name: Access env variables
        run: |
          echo "Project: $project"
          echo "Component: $component"
          echo "Environment: $environment"