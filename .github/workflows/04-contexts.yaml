name: Contexts demo
on: [push]                            # Triggers the workflow on every push to the repository

env:
  project: "roboshop"
  component: "catalogue"
  environment: "dev"

jobs:
  # Job name
  github-context:
    runs-on: ubuntu-latest            # Github hosted runners
    outputs:
      image-version: ${{ steps.tag.outputs.version }} 
      image-name: ${{ steps.tag.outputs.image-name }}
    steps:
      - name: Print info
        run: |
          echo "${{ toJson(github) }}"
          echo "Branch name: ${{ github.ref_name }}"
      
      - name: Access env variables
        run: |
          echo "Project: $project"
          echo "Component: $component"
          echo "Environment: $environment"

      - name: Print secrets
        run: |
          echo "DB Username: ${{ secrets.DB_USER }}"
          echo "DB Password: ${{ secrets.DB_PASSWORD }}"

      - name: Print variables
        run: |
          echo "DB URL: ${{ vars.DB_URL }}"

      - name: Image tag
        id: tag     # id is mandatory, to access the output of this step in later steps.
        run: |
          echo "version=1.0.0" >> $GITHUB_OUTPUT
          echo "image-name=catalogue" >> $GITHUB_OUTPUT
        
      - name: Print previous step output
        run: |
          echo "Version: ${{ steps.tag.outputs.version }}"
          echo "Image name: ${{ steps.tag.outputs.image-name }}"

      # Useful within the job
      - name: github env
        run: |
          echo "Course=github-actions" >> $GITHUB_ENV
          echo "Duration=5 Hours" >> $GITHUB_ENV

      - name: Print github env
        run: |
          echo "Course: $Course"
          echo "Duration: $Duration"

  # # Job name
  # deploy:
  #   needs: github-context
  #   runs-on: ubuntu-latest            # Github hosted runners
  #   steps:
  #     - name: Print github env in another job
  #       run: |
  #         echo "Course: $Course"
  #         echo "Duration: $Duration"

  # Job name
  deploy:
    needs: github-context             # Depends on above job (github-context) can be accessed using outputs section
    runs-on: ubuntu-latest            # Github hosted runners
    steps:
      - name: Print github env in another job
        run: |
          echo "Image Version: ${{ needs.github-context.outputs.image-version }}"
          echo "Image Name: ${{ needs.github-context.outputs.image-name }}"

  scan:
    runs-on: ubuntu-latest            # Github hosted runners
    steps:
      - name: Run sonar scan
        run: echo "Sonar Scan"

      - name: Print job contexts
        run: echo "${{ toJson(job) }}"

      - name: Print runner contexts
        run: echo "${{ toJson(runner) }}"